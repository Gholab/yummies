<div class="paymentmodal">
  <h5 class="paymentmodal-title">Payez la Réservation</h5>

  <app-price-display [price]="price" [isSplitPayment]="false"></app-price-display>
  <img src="assets/icons/pay-by-card.png" class="pay-by-card-icon"/>
  <p class="please-consult-terminal">Veuillez consulter le terminal de paiement ci-dessous !</p>
  <app-button icon="assets/icons/logout.png" [text]="'Annuler'" size="fullwidth" (click)="closeModal(false)"></app-button>

</div>
