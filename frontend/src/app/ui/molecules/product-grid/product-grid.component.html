<div class="scroll" role="region" aria-label="Liste de produits">
  <app-title size="m" [text]="title"></app-title>
  @if (subtitle!=''){
    <app-title size="s" [text]="subtitle"></app-title>
  }
  <div class="grid">
    @for (item of items; track item._id) {
      <card-item [item]="item"></card-item>
    }
  </div>
</div>
