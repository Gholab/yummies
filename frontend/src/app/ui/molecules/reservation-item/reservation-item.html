<div class="reservation-card">
  <div class="reservation-info">
    <div class="reservation-header">
      <app-title [text]="reservation.companyName" size="s" color="primary" class="company"></app-title>
      <span class="code">#{{ reservation.reservationCode }}</span>
    </div>

    <div class="reservation-details">
      <p><strong>Invités attendus :</strong> {{ reservation.expectedGuests }}</p>
      <p><strong>Participants :</strong> {{ reservation.actualGuests }}</p>
      <p><strong>Prix du menu :</strong> {{ reservation.menuPrice | currency:'EUR' }}</p>
      <p><strong>Total :</strong> {{ totalPrice | currency:'EUR' }}</p>
    </div>
  </div>

  <div class="reservation-action">
    <app-button
      text="Payer la réservation >"
      color="primary"
      size="xs"
      (click)="onPayClick()">
    </app-button>
  </div>
</div>
