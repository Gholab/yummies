<div class="reservation-list-title-container">
  <app-title text="Liste des reservations" size="m" color="primary"></app-title>
</div>

<div class="reservation-list-content">
  <app-button  (click)="addReservation()" class="add-reservation" text="Ajouter une reservation" color="secondary" size="s"></app-button>
  @for (r of reservations; track r.reservationCode) {
    <app-reservation-item
      [reservation]="r"
      (payReservation)="onPayReservation($event)">
    </app-reservation-item>
  } @empty {
    <p class="empty">Aucune réservation enregistrée.</p>
  }
</div>
